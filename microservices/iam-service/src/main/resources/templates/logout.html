<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Instrument Serif"', 'serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="font-sans antialiased bg-stone-50 text-neutral-900">

<main class="relative min-h-screen flex items-center justify-center px-6 overflow-hidden">

    <!-- soft gradient glow -->
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 h-[30rem] w-[30rem] rounded-full bg-orange-300/30 blur-3xl"></div>

    <div class="relative w-full max-w-md text-center">

        <div class="mx-auto mb-8 flex h-14 w-14 items-center justify-center rounded-full bg-neutral-900 text-white">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12H3m12 0-4-4m4 4-4 4M21 4v16"/>
            </svg>
        </div>

        <h1 class="font-serif text-6xl md:text-7xl leading-[0.95] tracking-tight">
            Leaving<br>
            <span class="italic text-orange-500">already?</span>
        </h1>

        <p class="mt-6 text-neutral-500">
            Are you sure you want to log out?
        </p>

        <div class="mt-10 flex flex-col-reverse gap-3 sm:flex-row sm:justify-center">
            <a href="/"
               class="flex items-center justify-center rounded-xl border border-neutral-200 bg-white px-6 py-3 text-sm font-medium transition hover:border-neutral-300 hover:bg-neutral-50">
                Cancel
            </a>

            <form action="/logout" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit"
                        class="group w-full flex items-center justify-center gap-2 rounded-xl bg-neutral-900 px-6 py-3 text-sm font-medium text-white transition hover:bg-neutral-800 active:scale-[0.99]">
                    Yes, log out
                    <svg class="h-4 w-4 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/>
                    </svg>
                </button>
            </form>
        </div>

    </div>
</main>

</body>
</html>
