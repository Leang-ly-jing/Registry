<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Instrument Serif"', 'serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="font-sans antialiased bg-stone-50 text-neutral-900">

<div class="min-h-screen flex flex-col">

    <!-- Top bar -->
    <header class="w-full border-b border-neutral-200/70 bg-stone-50/80 backdrop-blur">
        <div class="mx-auto max-w-5xl flex items-center justify-between px-6 py-4">
            <div class="flex items-center gap-2">
                <span class="h-3 w-3 rounded-full bg-orange-500"></span>
                <span class="text-sm tracking-[0.2em] uppercase text-neutral-500">Studio</span>
            </div>

            <a href="/logout">
                <button type="submit"
                        class="group flex items-center gap-2 rounded-xl border border-neutral-200 bg-white px-4 py-2 text-sm font-medium transition hover:border-neutral-300 hover:bg-neutral-50">
                    Logout
                    <svg class="h-4 w-4 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12H3m12 0-4-4m4 4-4 4M21 4v16"/>
                    </svg>
                </button>
            </a>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 mx-auto w-full max-w-5xl px-6 py-16 lg:py-24">

        <p class="text-sm text-neutral-500">You're signed in.</p>
        <h1 class="mt-3 font-serif text-6xl md:text-8xl leading-[0.95] tracking-tight">
            Hello,<br>
            <span class="italic text-orange-500" th:text="${name}">Jane Doe</span>
        </h1>

        <div class="mt-16 grid gap-4">

            <!-- Profile card -->
            <div class="rounded-2xl border border-neutral-200 bg-white p-6">
                <p class="text-xs uppercase tracking-widest text-neutral-400">Profile</p>
                <div class="mt-5 flex items-center gap-4">
                    <!-- Avatar -->
                    <img th:if="${avatar}" th:src="${avatar}" alt="Avatar"
                         referrerpolicy="no-referrer"
                         class="h-14 w-14 rounded-full object-cover ring-1 ring-neutral-200">
                    <!-- Initial fallback when there is no avatar -->
                    <div th:unless="${avatar}"
                         class="flex h-14 w-14 items-center justify-center rounded-full bg-neutral-900 text-lg font-semibold uppercase text-white"
                         th:text="${#strings.isEmpty(name)} ? '?' : ${#strings.substring(name, 0, 1)}">J</div>

                    <div class="min-w-0">
                        <p class="font-medium truncate" th:text="${name}">Jane Doe</p>
                        <p th:if="${email}" class="text-sm text-neutral-500 truncate"
                           th:text="${email}">jane@example.com</p>
                    </div>
                </div>
            </div>

            <!-- Authorities card -->
            <div class="rounded-2xl border border-neutral-200 bg-white p-6">
                <p class="text-xs uppercase tracking-widest text-neutral-400">Authorities</p>
                <div class="mt-4 flex flex-wrap gap-2">
                    <span th:each="authority : ${authorities}"
                          th:text="${authority}"
                          class="rounded-full border border-neutral-200 bg-stone-50 px-3 py-1 text-xs font-medium text-neutral-700">
                        ROLE_USER
                    </span>
                </div>
            </div>

        </div>
    </main>

    <footer class="mx-auto w-full max-w-5xl flex justify-between px-6 py-8 text-xs text-neutral-400">
        <span>&copy; 2026</span>
        <span>Secure session</span>
    </footer>
</div>

</body>
</html>
